[workspace]
name = "pypsa-Xplore"
version = "0.1.0"
description = "Jupyter notebooks for exploring and visualizing results from PyPSA-X models (PyPSA-Spain, PyPSA-Eur)."
authors = ["PyPSA-Xplore contributors"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.11,<3.13"
pypsa = "*"
pandas = "*"
numpy = "*"
geopandas = "*"
cartopy = "*"
matplotlib = "*"
pyyaml = "*"
jinja2 = "*"          # required by pandas Styler (styled summary tables)
jupyterlab = "*"
ipykernel = "*"
nbstripout = "*"      # strips notebook outputs before committing (see README)

[tasks]
lab = "jupyter lab"
# Registers the nbstripout git filter in this clone (.git/config is not versioned)
# and also strips kernel metadata that varies between machines.
setup-nbstripout = "nbstripout --install && git config filter.nbstripout.extrakeys 'metadata.kernelspec.display_name metadata.language_info.version'"
